server:
  port: 8084

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: postgres123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer:
        org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer:
        org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.store.payment.event
        spring.json.use.type.headers: true
        spring.json.type.mapping: >
          inventoryReserved:com.store.payment.event.InventoryReservedEvent

    producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        properties:
          spring.json.add.type.headers: true
          spring.json.type.mapping: >
            paymentFailed:com.store.payment.event.PaymentFailedEvent,
            paymentCompleted:com.store.payment.event.PaymentCompletedEvent

logging:
  level:
    root: INFO
    com.store: DEBUG
    org.springframework.kafka: INFO